<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<title>Guida PaghePro — versione stampabile</title>
<style>
  @page{ size:A4; margin:14mm 14mm 16mm; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#1f2a44;line-height:1.5}
  .page{page-break-after:always;padding:6px 0}
  .page:last-child{page-break-after:auto}

  /* COPERTINA */
  .cover{min-height:255mm;display:flex;flex-direction:column;justify-content:center;
    background:linear-gradient(150deg,#20307a,#2f54ff 55%,#7b61ff);color:#fff;border-radius:18px;padding:40px}
  .cover .mark{width:60px;height:60px;border-radius:16px;background:rgba(255,255,255,.18);
    display:grid;place-items:center;font-size:32px;font-weight:800;margin-bottom:22px}
  .cover h1{font-size:42px;line-height:1.1;margin-bottom:14px;max-width:80%}
  .cover p{font-size:17px;color:#e2e7ff;max-width:80%;margin-bottom:24px}
  .pills{display:flex;flex-wrap:wrap;gap:9px;margin-top:6px}
  .pill{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);padding:7px 13px;border-radius:999px;font-size:13px}
  .cover .foot{margin-top:auto;padding-top:30px;font-size:13px;color:#c9d2ff;border-top:1px solid rgba(255,255,255,.25)}

  /* SCHEDA */
  .badge{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:#2f54ff;
    background:#eaf0ff;padding:6px 12px;border-radius:999px;margin-bottom:10px}
  h2.titolo{font-size:24px;margin-bottom:6px}
  .tagline{color:#64708a;font-size:14px;margin-bottom:14px}
  .shot{width:100%;border:1px solid #e3e9f7;border-radius:12px;overflow:hidden;box-shadow:0 8px 22px rgba(31,42,68,.12);margin-bottom:16px}
  .shot .bar{height:24px;background:#f4f6fc;display:flex;align-items:center;gap:5px;padding:0 10px;border-bottom:1px solid #e3e9f7}
  .shot .bar i{width:8px;height:8px;border-radius:50%}
  .shot .bar i:nth-child(1){background:#ff5f57}.shot .bar i:nth-child(2){background:#febc2e}.shot .bar i:nth-child(3){background:#28c840}
  .shot .bar span{margin-left:8px;font-size:10px;color:#9aa6c0;font-weight:600}
  .shot img{display:block;width:100%;height:auto}

  h3.cs{font-size:12px;color:#64708a;text-transform:uppercase;letter-spacing:1px;margin:4px 0 10px}
  .passo{display:flex;gap:11px;margin-bottom:10px}
  .passo .num{width:26px;height:26px;flex:none;border-radius:8px;background:linear-gradient(135deg,#2f54ff,#7b61ff);
    color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center}
  .passo p{font-size:13.5px;color:#34405e}
  .passo p b{color:#1f2a44}
  .tip{margin-top:8px;display:flex;gap:10px;background:#fff7e8;border:1px solid #ffe6b0;border-radius:12px;
    padding:11px 13px;font-size:12.5px;color:#7a5b16}
  .tip .ek{font-size:16px}

  /* RIEPILOGO */
  .riep{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
  .rc{border:1px solid #e3e9f7;border-radius:12px;padding:13px 15px;display:flex;gap:11px;align-items:flex-start}
  .rc .ic{width:30px;height:30px;border-radius:9px;background:#eaf0ff;display:grid;place-items:center;font-size:15px;flex:none}
  .rc b{display:block;font-size:14px}.rc small{color:#64708a;font-size:12.5px}

  .num-scheda{float:right;color:#aab4cf;font-size:12px;font-weight:700}
</style>
</head>
<body>
<div id="doc"></div>

<script src="guida-data.js"></script>
<script>
  const doc = document.getElementById('doc');
  const oggi = new Date().toLocaleDateString('it-IT',{day:'2-digit',month:'long',year:'numeric'});
  let n = 0;
  SLIDES.forEach(s=>{
    const page = document.createElement('section');
    page.className = 'page';
    if(s.tipo==='hero'){
      page.innerHTML = `<div class="cover">
        <div class="mark">P</div>
        <h1>${s.titolo}</h1>
        <p>${s.intro}</p>
        <div class="pills">${s.pills.map(p=>`<span class="pill">${p}</span>`).join('')}</div>
        <div class="foot">Guida all'uso del software · PaghePro Studio · ${oggi}</div>
      </div>`;
    } else if(s.tipo==='outro'){
      page.innerHTML = `<span class="badge">${s.icona} ${s.menu}</span>
        <h2 class="titolo">${s.titolo}</h2>
        <p class="tagline">${s.tagline}</p>
        <div class="riep">${s.cards.map(c=>`<div class="rc"><div class="ic">${c[0]}</div><div><b>${c[1]}</b><small>${c[2]}</small></div></div>`).join('')}</div>
        <div class="tip" style="margin-top:16px"><span class="ek">💡</span><div>${s.nota}</div></div>`;
    } else {
      n++;
      page.innerHTML = `<span class="num-scheda">Scheda ${n}</span>
        <span class="badge">${s.icona} ${s.menu}</span>
        <h2 class="titolo">${s.titolo}</h2>
        <p class="tagline">${s.tagline}</p>
        <div class="shot"><div class="bar"><i></i><i></i><i></i><span>PaghePro Studio</span></div><img src="${s.img}" alt="${s.menu}"></div>
        <h3 class="cs">Come si fa</h3>
        ${s.passi.map((p,k)=>`<div class="passo"><div class="num">${k+1}</div><p>${p}</p></div>`).join('')}
        ${s.tip?`<div class="tip"><span class="ek">💡</span><div>${s.tip}</div></div>`:''}`;
    }
    doc.appendChild(page);
  });
</script>
</body>
</html>
