# ─────────────────────────────────────────────────────────────
# Blueprint Render.com per Paghe SaaS (backend + frontend).
# Su Render: New → Blueprint → seleziona questo repo → Apply.
# Vedi DEPLOY.md per la guida completa passo-passo.
#
# ►► MODALITÀ "PROVA GRATIS" ATTIVA (0 €, niente carta) ◄◄
#    - Il backend si "addormenta" se non usato: la prima apertura è lenta (~30-60s).
#    - I DATI SI AZZERANO ai riavvii: gli account di prova spariscono. OK per provare,
#      NON per dati veri.
#    Per passare a USO REALE (dati salvati) cambia le 3 righe segnate "# PER USO REALE".
# ─────────────────────────────────────────────────────────────

services:
  # 1) BACKEND — API .NET in Docker
  - type: web
    name: paghe-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free               # PER USO REALE: cambia in "starter" (~7$/mese, serve per il disco)
    region: frankfurt        # data center in Europa
    healthCheckPath: /health
    # PER USO REALE: togli il "#" alle 4 righe qui sotto (disco persistente = dati salvati)
    # disk:
    #   name: paghe-data
    #   mountPath: /data
    #   sizeGB: 1
    envVars:
      - key: ConnectionStrings__Default
        value: Data Source=/tmp/paghe.db   # PER USO REALE: metti  Data Source=/data/paghe.db
      - key: Jwt__Key
        generateValue: true  # Render genera una chiave segreta forte e la tiene riservata
      - key: PAGHE_DATA_KEY
        sync: false          # obbligatoria: incolla l'output di `openssl rand -base64 32`
      - key: Cors__Origini__0
        sync: false          # da impostare a mano = URL pubblico del frontend (es. https://paghe-frontend.onrender.com)

  # 2) FRONTEND — sito statico (React/Vite). Gratis sempre. Punta all'URL del backend.
  - type: web
    name: paghe-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        sync: false          # da impostare a mano = URL pubblico di paghe-api (es. https://paghe-api.onrender.com)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
