# ─────────────────────────────────────────────────────────────
# Blueprint Render.com per PaghePro.
# Su Render: New → Blueprint → seleziona questo repo → Apply.
# Guida completa: docs/DEPLOY-GRATIS.md
#
# Un solo servizio: ASP.NET serve la SPA React e le API dallo stesso
# dominio, quindi non servono CORS né VITE_API_URL.
#
# Il database NON sta qui: è PostgreSQL su Supabase. Il piano Free di
# Render non ha disco persistente, quindi un database dentro il container
# verrebbe cancellato a ogni riavvio. Tenendolo fuori, i dati restano.
# ─────────────────────────────────────────────────────────────

services:
  - type: web
    name: paghepro
    runtime: docker
    dockerfilePath: ./Dockerfile.railway
    dockerContext: .
    # Modalità personale locale: il servizio cloud non deve ripartire da un commit.
    # La sospensione effettiva dell'istanza già creata va confermata una volta nel dashboard.
    autoDeployTrigger: off
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

      # Stringa Supabase in formato Npgsql, Session pooler (IPv4).
      # La Direct connection risolve solo su IPv6: da Render non funziona.
      # La password va scritta com'è: il percent-encode vale solo per l'URI.
      - key: ConnectionStrings__Default
        sync: false

      # Firma i token di accesso. In Production l'avvio è bloccato se
      # manca o è più corta di 32 byte: `openssl rand -base64 48`.
      - key: Jwt__Key
        sync: false

      # Cifra IBAN e dati sanitari a riposo: `openssl rand -base64 32`.
      # Da conservare fuori da Render: se si perde, quei dati non si recuperano.
      - key: PAGHE_DATA_KEY
        sync: false

      # Prova il flusso di trasmissione senza inviare nulla di reale.
      - key: Sdi__Provider
        value: Simulato

      # Aurora accesa su DeepSeek per decisione esplicita del titolare (23 agosto 2026), con il
      # gate G1-SaaS ancora aperto: i dati che gli strumenti governati leggono escono verso
      # api.deepseek.com. Per rispegnerla basta riportare Ai__Provider a "Spento".
      # Il calcolo dei cedolini resta deterministico e non passa dal provider.
      - key: Ai__Provider
        value: DeepSeek
      # Chiave del provider: segreto, si inserisce nel dashboard Render, mai nel repository.
      - key: Ai__ApiKey
        sync: false
      # Google Gemini è la riserva automatica: riceve la richiesta soltanto se DeepSeek non
      # risponde. Per le immagini viene usato direttamente, perché DeepSeek non ha la vista.
      - key: Ai__UsaGeminiComeFallback
        value: "true"
      - key: Ai__GeminiApiKey
        sync: false
      # gemini-3.7-flash ha risposto 503 "high demand" nelle prove del 24 agosto 2026:
      # la riserva sarebbe muta proprio quando serve. gemini-3.5-flash risponde e vede.
      - key: Ai__ModelloGemini
        value: gemini-3.5-flash
      - key: Ai__SoloLocale
        value: "false"
      - key: Ai__ProviderCloudApprovato
        value: "true"
      # Resta falso: riguarda solo il runtime locale Ollama, che su Render non gira.
      - key: Ai__GateLocaleG1Verificato
        value: "false"
      # A2 = chat e letture governate. Le scritture (A3) richiedono anche Ai__ModalitaA3
      # e la coppia esatta tenant:utente in Ai__CoppieShadowA3__0.
      - key: Ai__GateAurora
        value: A2
      - key: Ai__ModalitaA3
        value: Off

      # Riduce il consumo di memoria: il piano Free ha 512 MB.
      - key: DOTNET_gcServer
        value: "0"

      # .NET sorveglia i file di configurazione con inotify. Durante il cambio di versione
      # convivono due istanze e il contenitore supera il limite di 128 sentinelle: il processo
      # muore con "user limit on the number of inotify instances has been reached" e il deploy
      # fallisce. Con il polling la sorveglianza non usa inotify.
      - key: DOTNET_USE_POLLING_FILE_WATCHER
        value: "1"

      - key: Logging__LogLevel__Microsoft.EntityFrameworkCore
        value: Warning
